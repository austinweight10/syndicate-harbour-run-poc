# Syndicate — do not invent client_id. Link with `shopify app config link` when Austin has a Partner app.
name = "Syndicate"
client_id = "3e07c3bf1ff5f21029c5767687898e27"
application_url = "https://syndicate-harbour-run.fly.dev"
embedded = true

[access_scopes]
# Reads are required at install. Writes are optional so Deploy can request
# them when the merchant ships a storefront fix or marketing pack.
scopes = "read_orders,read_products,read_customers"
optional_scopes = [ "write_products", "write_content", "write_customers" ]

[auth]
redirect_urls = [ "https://syndicate-harbour-run.fly.dev/auth/callback", "http://127.0.0.1:44731/auth/callback" ]

[webhooks]
api_version = "2025-10"

  [[webhooks.subscriptions]]
  topics = ["app/uninstalled"]
  uri = "/webhooks/app/uninstalled"

  [[webhooks.subscriptions]]
  topics = ["shop/update"]
  uri = "/webhooks/shop/update"
